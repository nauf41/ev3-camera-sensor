[package]
name = "mcu"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version="0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "rp2040", "critical-section-impl", "unstable-pac"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
opt-level = 1
debug = 2
strip = false
